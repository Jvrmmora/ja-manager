# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ja-backend

on:
  push:
    branches:
      - main
    # Un cambio que solo toca el frontend no tiene por qué redesplegar la API.
    paths:
      - 'backend/**'
      - '.github/workflows/main_ja-backend.yml'
  workflow_dispatch:

# Un despliegue a la vez. No se cancela a medias: interrumpir un deploy en
# vuelo puede dejar la Web App en un estado inconsistente.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      # setup-node solo cachea ~/.npm, y reinstalar los 647 paquetes desde
      # ahí ha llegado a tardar 6 minutos. Cacheando node_modules entero,
      # cuando el lockfile no cambia el `npm ci` se salta por completo.
      - name: Restaurar node_modules del backend
        id: cache-backend-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: node-modules-backend-${{ runner.os }}-${{ runner.arch }}-node20-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        if: steps.cache-backend-modules.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm run test:ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # El paquete se arma en ./deploy y no en ./backend a propósito: hacer
      # el prune sobre backend/node_modules envenenaría el cache, que
      # actions/cache guarda al terminar el job.
      # Azure solo necesita dist/ (incluido dist/docs/oas3.yaml), el
      # package.json y las dependencias de producción; las de desarrollo
      # eran ~90 MB de peso muerto en cada despliegue.
      - name: Preparar paquete de despliegue
        run: |
          mkdir -p deploy
          cp -r backend/dist deploy/dist
          cp backend/package.json backend/package-lock.json deploy/
          cp -r backend/node_modules deploy/node_modules
          (cd deploy && npm prune --omit=dev --no-audit --fund=false)
          echo "Tamaño del paquete: $(du -sh deploy | cut -f1)"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B71BF50C162492EB359B308911696D4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_055DEC8A402A48A9BF0013737154EF43 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E7CD0C51A574328BE90A8E198758344 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ja-backend'
          slot-name: 'Production'
          package: .
