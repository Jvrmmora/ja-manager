name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    # Un cambio que solo toca el backend no tiene por qué reconstruir la SPA.
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-yellow-river-04315080f.yml'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-yellow-river-04315080f.yml'

# En PRs, un push nuevo cancela el build anterior. En main no se cancela:
# interrumpir el upload a SWA dejaría el sitio a medio publicar.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Configurar Node.js con la versión requerida
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # setup-node solo cachea ~/.npm; reinstalar desde ahí ha oscilado
      # entre 1 y 3.5 minutos. Cacheando node_modules entero, cuando el
      # lockfile no cambia el `npm ci` se salta por completo.
      - name: Restaurar node_modules del frontend
        id: cache-frontend-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-frontend-${{ runner.os }}-${{ runner.arch }}-node20-${{ hashFiles('frontend/package-lock.json') }}

      # Instalar dependencias y construir el frontend explícitamente
      - name: Install Dependencies
        if: steps.cache-frontend-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      # La construcción de la imagen Docker del frontend vive ahora en
      # `docker-images.yml`: esa imagen no se publica en ningún registro
      # (SWA despliega `frontend/dist`), así que solo hace falta validarla
      # cuando cambian el Dockerfile, nginx.conf o las dependencias.

      # El ID token de OIDC caduca a los ~10 minutos, así que se pide
      # justo antes de desplegar. Si se pide al inicio del job, los pasos
      # de build y de validación de Docker pueden agotarlo y Azure responde
      # "No matching Static Web App was found or the api key was invalid".
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Build And Deploy (Upload Dist)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_RIVER_04315080F }}
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # Para SWA, cuando subimos artefactos ya construidos, usar app_location apuntando a dist
          app_location: './frontend/dist'
          api_location: ''
          github_id_token: ${{ steps.idtoken.outputs.result }}
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      # Mismo esquema de autenticación (OIDC) que el job de deploy;
      # sin esto Azure responde "No matching static site found" y el
      # entorno de versión preliminar del PR nunca se elimina.
      - name: Get Id Token
        uses: actions/github-script@v8
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_RIVER_04315080F }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: 'close'
          app_location: './frontend'
