services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ja-manager-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      TZ: America/Bogota
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_EXP: ${TOKEN_EXP:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:3000}
    ports:
      - '5001:5000'
    networks:
      - ja-manager-network
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ja-manager-frontend
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ja-manager-network

networks:
  ja-manager-network:
    driver: bridge

volumes:
  backend-logs:
